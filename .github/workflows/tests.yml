# Tests und Code-Prüfung – bei jedem Push auf main, bei Pull Requests und vor jedem Release-Build.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Commit oder Tag, der geprüft wird (leer = der auslösende)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get install -y --no-install-recommends xvfb lua5.1 >/dev/null

      - name: Code-Prüfung (ruff)
        run: ruff check .

      - name: Tests (Logik, Leeroylink-Szenario, Übersetzungen, Fenster unter Xvfb)
        run: xvfb-run -a python -m unittest discover -s tests -v

  # Windows: die Teile, die nur dort laufen (Verschlüsselung, Prozessliste, Signaturprüfung, Warten auf Prozesse),
  # das Fenster unter echtem Windows-Tk und ein Probebau der .exe mit Rauchtest – ohne etwas hochzuladen.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt

      - name: Tests unter Windows
        run: python -m unittest discover -s tests -v

      - name: Probebau der .exe
        run: python -m PyInstaller --noconfirm --clean leeroyzan.spec

      - name: Rauchtest der .exe
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "selftest"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist\Leeroyzan.exe $dir
          $out = Join-Path $dir "selftest.txt"
          $p = Start-Process -FilePath (Join-Path $dir "Leeroyzan.exe") -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host "Keine Ausgabe vom Rauchtest." }
          $sig = Get-AuthenticodeSignature dist\Leeroyzan.exe
          Write-Host "Signatur: $($sig.Status)  Größe: $((Get-Item dist\Leeroyzan.exe).Length) Bytes"
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path $out -SimpleMatch "SELFTEST OK" -Quiet)) {
            Write-Error "Rauchtest der .exe fehlgeschlagen (Exit-Code $($p.ExitCode))."
            exit 1
          }
