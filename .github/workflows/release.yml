# Baut Leeroyzan.exe, sobald auf GitHub ein Release veröffentlicht wird,
# und hängt die .exe samt SHA-256-Prüfsumme an das Release an.
# Der Auto-Updater im Manager lädt genau diese beiden Dateien.

name: Build release exe

on:
  release:
    types: [published]
  workflow_dispatch:        # manuell startbar (Actions -> Build release exe -> Run workflow)
    inputs:
      tag:
        description: "Release-Tag, an das die .exe angehängt wird (z. B. v2.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versionsnummer prüfen
        shell: pwsh
        run: |
          $line = Select-String -Path leeroyzan.py -Pattern '^APP_VERSION = "(.+)"' | Select-Object -First 1
          $code = $line.Matches[0].Groups[1].Value
          $tag  = $env:TAG -replace '^v', ''
          Write-Host "APP_VERSION im Code: $code  /  Release-Tag: $tag"
          if ($code -ne $tag) {
            Write-Error "APP_VERSION ($code) passt nicht zum Release-Tag ($env:TAG). Bitte APP_VERSION anpassen."
            exit 1
          }

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip pyinstaller tkinterdnd2

      - name: EXE bauen
        shell: pwsh
        run: |
          $icon = @()
          if (Test-Path leeroyzan.ico) { $icon = @('--icon', 'leeroyzan.ico') }
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Leeroyzan @icon `
            --collect-all tkinterdnd2 `
            leeroyzan.py

      - name: Prüfsumme erzeugen
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Leeroyzan.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Leeroyzan.exe" | Out-File -Encoding ascii -NoNewline dist\Leeroyzan.exe.sha256
          Write-Host "SHA-256: $hash"

      - name: An Release anhängen
        shell: pwsh
        run: |
          gh release upload $env:TAG dist\Leeroyzan.exe dist\Leeroyzan.exe.sha256 --clobber
